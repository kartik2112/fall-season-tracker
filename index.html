<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New England Fall Foliage Tracker</title>
<meta name="description" content="Live fall foliage map and webcams for New Hampshire, Maine, Vermont, Massachusetts and the rest of New England.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg);
         display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 380px; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .datebox { display: flex; align-items: center; gap: 10px; flex: 1 1 300px; min-width: 260px; }
  .datebox input { flex: 1; accent-color: var(--accent); }
  #dateLabel { min-width: 150px; font-weight: 600; }
  #dateLabel span { font-weight: 400; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .legend i, .dot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px;
                    border: 1px solid rgba(0,0,0,.18); }
  #map { min-height: 0; background: #dfe7ea; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; padding: 11px 6px; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted);
                 cursor: pointer; border-bottom: 3px solid transparent; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .filters button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 11px; font: inherit;
                    font-size: 12px; cursor: pointer; color: var(--ink); }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters label { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #list { overflow-y: auto; flex: 1; padding: 8px 10px 16px; }
  .note { font-size: 12px; color: var(--muted); padding: 4px 4px 10px; }
  .dest { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 9px 8px; border-radius: 8px; cursor: pointer;
          border-bottom: 1px solid var(--line); }
  .dest:hover { background: var(--chip); }
  .dest b { font-size: 14px; }
  .dest .st { color: var(--muted); font-size: 12px; margin-left: 4px; font-weight: 400; }
  .dest .when { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .strip { display: flex; gap: 2px; margin-top: 3px; }
  .strip i { width: 13px; height: 8px; border-radius: 2px; background: #ddd; }
  .strip i:first-child { outline: 1.5px solid var(--ink); outline-offset: 0; }
  .cams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cam { cursor: pointer; }
  .cam .frame { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #1c1612; }
  .cam img, .cam iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .cam iframe { pointer-events: none; }
  .cam .live { position: absolute; left: 6px; top: 6px; z-index: 2; background: #d21f1f; color: #fff; font-size: 10px; font-weight: 700;
               padding: 1px 6px; border-radius: 4px; letter-spacing: .04em; }
  .cam.off .live { background: #666; }
  .cam.off img { filter: grayscale(1) brightness(.7); }
  .cam .play { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; color: #fff; font-size: 26px;
               text-shadow: 0 1px 6px rgba(0,0,0,.7); opacity: 0; transition: opacity .15s; }
  .cam:hover .play { opacity: .9; }
  .cam .frame.playing .play { display: none; }
  .cam .nm { font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.25; }
  .cam .sub { font-size: 11px; color: var(--muted); }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .stage { font-weight: 600; }
  .pop .me { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pop .cams { margin-top: 8px; }
  .pop .lbl { font-size: 11px; color: var(--muted); margin-top: 8px; text-transform: uppercase; letter-spacing: .05em; }
  .leaflet-popup-content { margin: 12px 14px; }
  .camicon { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 3px solid #888; display: grid; place-items: center;
             font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .layers { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 12px; }
  .layers label { display: block; cursor: pointer; white-space: nowrap; }
  #modal { position: fixed; inset: 0; background: rgba(20,14,10,.8); z-index: 2000; display: none; place-items: center; padding: 16px; }
  #modal.on { display: grid; }
  #modal .box { width: min(960px, 100%); background: #14100d; border-radius: 12px; overflow: hidden; color: #fff; }
  #modal .player { aspect-ratio: 16/9; }
  #modal iframe { width: 100%; height: 100%; border: 0; display: block; }
  #modal .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  #modal .bar div { flex: 1; }
  #modal .bar small { color: #bbb; display: block; }
  #modal a { color: #ffb38a; }
  #modal button { background: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 52vh 1fr; height: auto; min-height: 100%; }
    aside { border-left: 0; border-top: 1px solid var(--line); min-height: 60vh; }
    #list { overflow: visible; }
    h1 small { display: none; }
  }

  ['MnBqd6bB4Jw', 'Kennebunk Beach', 'ME', 43.3460, -70.4980, 'Boston and Maine Live'],
  ['H-_sGi4Sbtk', 'Stratton Mountain – base', 'VT', 43.1134, -72.9082, 'Stratton Mountain'],
  ['9E00W9R_Cnc', 'Stratton Mountain – summit', 'VT', 43.0865, -72.9260, 'Stratton Mountain'],
  ['WYgjhPHIw1k', 'Lake Champlain – Colchester marina', 'VT', 44.5560, -73.2270, 'Champlain Marina'],
  ['VsuSbXPN93o', 'Newburyport – Market Square', 'MA', 42.8115, -70.8700, 'Newburyport.com'],
  ['_OeFhA2XqqA', 'Cape Cod Canal', 'MA', 41.7410, -70.6220, 'Massachusetts Maritime Academy'],
  ['-uE-gOt6shs', 'Cape Cod – Bass River', 'MA', 41.6650, -70.1850, 'Boston and Maine Live'],
  ['5-ClAzUV2UA', 'Woods Hole harbor', 'MA', 41.5235, -70.6720, 'Go Martha\'s Vineyard'],
  ['sp-FHZY95QM', 'Nantucket – Main Street', 'MA', 41.2835, -70.0995, 'FisherNantucket.com'],
  ['dKI_sYiiY7Y', 'New London waterfront rail', 'CT', 41.3540, -72.0930, 'Railside Live'],
  ['Dv2XxhsWqWY', 'South Norwalk', 'CT', 41.0960, -73.4210, 'Virtual Railfan'],
  ['c9XTpzuSNo0', 'Downtown Westerly', 'RI', 41.3776, -71.8273, 'XC Media Design'],
  ['yvJlIBJ5m1o', 'Newport harbor', 'RI', 41.4870, -71.3170, 'Sightsailing Live'],
  ['9uAn-VdurrE', 'Davisville (North Kingstown)', 'RI', 41.6150, -71.4640, 'Virtual Railfan'],
  ['ejDld-hWwiU', 'Block Island – North Light', 'RI', 41.2270, -71.5760, 'Boston and Maine Live'],
].map(([id, name, st, lat, lon, by]) => ({ id, name, st, lat, lon, by, live: true }));

// ---------------------------------------------------------------- dates
const today = new Date(); today.setHours(12, 0, 0, 0);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const ymd = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
const fmt = (d, o = { weekday: 'short', month: 'short', day: 'numeric' }) => d.toLocaleDateString(undefined, o);
const efUrl = (d, hi) => `${EF_MAPS}/${d.getFullYear()}${hi ? '-highres' : ''}/${ymd(d)}.png`;
let offset = 0;                                   // days from today shown on the map

// ---------------------------------------------------------------- foliage raster sampling
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
const PALETTE = STAGES.map(s => [1, 3, 5].map(i => parseInt(s.c.slice(i, i + 2), 16)));
const dayCache = new Map();                       // offset -> Promise<{data,w,h,x0,y0,W,H} | null>

function loadDay(off) {
  if (!dayCache.has(off)) dayCache.set(off, new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onerror = () => resolve(null);
    img.onload = () => {
      const W = img.naturalWidth, H = img.naturalHeight;
      const px = lon => (lon - EF_BOUNDS.w) / (EF_BOUNDS.e - EF_BOUNDS.w) * W;
      const py = lat => (mercY(EF_BOUNDS.n) - mercY(lat)) / (mercY(EF_BOUNDS.n) - mercY(EF_BOUNDS.s)) * H;
      const x0 = Math.floor(px(NE_BOX.w)), y0 = Math.floor(py(NE_BOX.n));
      const w = Math.ceil(px(NE_BOX.e)) - x0, h = Math.ceil(py(NE_BOX.s)) - y0;
      const cv = Object.assign(document.createElement('canvas'), { width: w, height: h });
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, x0, y0, w, h, 0, 0, w, h);
      try { resolve({ data: ctx.getImageData(0, 0, w, h).data, w, h, px: lon => px(lon) - x0, py: lat => py(lat) - y0 }); }
      catch { resolve(null); }
    };
    img.src = efUrl(addDays(today, off));
  }));
  return dayCache.get(off);
}

function classify(d, i) {
  if (d[i + 3] < 128) return -1;
  let best = -1, bd = 1e9;
  PALETTE.forEach(([r, g, b], k) => {
    const dist = (d[i] - r) ** 2 + (d[i + 1] - g) ** 2 + (d[i + 2] - b) ** 2;
    if (dist < bd) { bd = dist; best = k; }
  });
  return best;
}

// Stage index 0-5 at a point, or -1. Coastal points can land on a transparent (water) pixel, so look around.
function stageAt(day, lat, lon) {
  if (!day) return -1;
  const cx = Math.floor(day.px(lon)), cy = Math.floor(day.py(lat));
  for (let r = 0; r <= 3; r++) {
    const votes = [0, 0, 0, 0, 0, 0];
    for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
      if (x < 0 || y < 0 || x >= day.w || y >= day.h) continue;
      const s = classify(day.data, (y * day.w + x) * 4);
      if (s >= 0) votes[s]++;
    }
    const max = Math.max(...votes);
    if (max) return votes.indexOf(max);
  }
  return -1;
}

// ---------------------------------------------------------------- map
const map = L.map('map', { zoomSnap: 0.5, minZoom: 5, maxBounds: [[37, -82], [50, -60]] }).fitBounds([[41.2, -73.8], [47.4, -67]]);
map.createPane('foliage').style.zIndex = 250;
map.createPane('labels').style.zIndex = 450;
map.getPane('labels').style.pointerEvents = 'none';
const esri = 'https://services.arcgisonline.com/ArcGIS/rest/services/Canvas';     // keyless basemap, labels drawn above the foliage
L.tileLayer(`${esri}/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}`, { attribution: 'Basemap &copy; Esri, HERE, Garmin, OpenStreetMap contributors', maxZoom: 15 }).addTo(map);
L.tileLayer(`${esri}/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}`, { pane: 'labels', maxZoom: 15 }).addTo(map);

const foliage = L.imageOverlay(efUrl(today), [[EF_BOUNDS.s, EF_BOUNDS.w], [EF_BOUNDS.n, EF_BOUNDS.e]], {
  pane: 'foliage', opacity: 0.72, crossOrigin: 'anonymous',
  attribution: 'Foliage estimate &amp; forecast: <a href="https://www.explorefall.com/fall-foliage-map">Explore Fall</a>',
}).addTo(map);
foliage.on('error', () => { $('#dateLabel').innerHTML += ' <span>· no map published for this day</span>'; });

const destLayer = L.layerGroup().addTo(map), camLayer = L.layerGroup().addTo(map);
let maineLayer = null, maineData = null;

// layer switches
const ctl = L.control({ position: 'topright' });
ctl.onAdd = () => {
  const el = L.DomUtil.create('div', 'layers');
  el.innerHTML = `<label><input type="checkbox" data-l="foliage" checked> Foliage map (Explore Fall, daily)</label>
    <label><input type="checkbox" data-l="maine"> Maine official zones (weekly)</label>
    <label><input type="checkbox" data-l="dest" checked> Destinations</label>
    <label><input type="checkbox" data-l="cams" checked> Live cams</label>`;
  L.DomEvent.disableClickPropagation(el);
  el.addEventListener('change', e => {
    const layer = { foliage, maine: maineLayer, dest: destLayer, cams: camLayer }[e.target.dataset.l];
    if (!layer) { e.target.checked = false; return; }
    e.target.checked ? layer.addTo(map) : layer.remove();
  });
  return el;
};
ctl.addTo(map);

// ---------------------------------------------------------------- Maine official zones
const maineStage = cls => ['Very Low', 'Low', 'Moderate', 'High', 'Peak', 'Past'].findIndex(p => cls.startsWith(p));
function inRing(ring, lon, lat) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function maineAt(lat, lon) {
  if (!maineData) return null;
  for (const f of maineData.features) {
    const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
    if (polys.some(p => inRing(p[0], lon, lat) && !p.slice(1).some(h => inRing(h, lon, lat)))) return f.properties;
  }
  return null;
}
fetch(MAINE_ZONES).then(r => r.json()).then(gj => {
  maineData = gj;
  maineLayer = L.geoJSON(gj, {
    style: f => ({ color: '#fff', weight: 1.5, dashArray: '4 3', fillOpacity: 0.75, fillColor: (STAGES[maineStage(f.properties.FoliageClass)] || { c: '#999' }).c }),
    onEachFeature: (f, l) => l.bindTooltip(`Maine zone ${f.properties.ZoneName}: <b>${f.properties.FoliageClass}</b><br><small>Maine Forest Service weekly report</small>`, { sticky: true }),
    attribution: 'Maine zones: <a href="https://www.maine.gov/dacf/mfs/projects/fall_foliage/report/index.shtml">Maine Forest Service</a>',
  });
}).catch(() => {});

// ---------------------------------------------------------------- live cams
const $ = s => document.querySelector(s);
const thumb = id => `https://i.ytimg.com/vi/${id}/hqdefault_live.jpg?t=${Math.floor(Date.now() / 3e5)}`;   // refreshed frame, 5-min buckets
const embed = (id, extra) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1&rel=0${extra}`;
const ytFrame = src => Object.assign(document.createElement('iframe'), {
  src, allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', referrerPolicy: 'strict-origin-when-cross-origin', allowFullscreen: true,
});

function camCard(cam) {
  const el = document.createElement('div');
  el.className = 'cam' + (cam.live ? '' : ' off');
  el.innerHTML = `<div class="frame"><span class="live">${cam.live ? '● LIVE' : 'OFFLINE'}</span><span class="play">▶</span>
    <img loading="lazy" alt="Latest frame from ${cam.name}" data-cam="${cam.id}" src="${thumb(cam.id)}"></div>
    <div class="nm">${cam.name}</div><div class="sub"><i class="dot" style="background:${(STAGES[cam.stage] || { c: '#ccc' }).c}"></i>${cam.st} · ${(STAGES[cam.stage] || { short: '—' }).short}</div>`;
  const frame = el.firstChild, img = frame.querySelector('img');
  img.onerror = () => { img.onerror = null; img.src = `https://i.ytimg.com/vi/${cam.id}/hqdefault.jpg`; };
  let timer;
  const stop = () => { clearTimeout(timer); frame.querySelector('iframe')?.remove(); frame.classList.remove('playing'); };
  el.addEventListener('mouseenter', () => {            // hover: muted live preview in place
    if (!cam.live) return;
    timer = setTimeout(() => { frame.append(ytFrame(embed(cam.id, '&controls=0'))); frame.classList.add('playing'); }, 350);
  });
  el.addEventListener('mouseleave', stop);
  el.addEventListener('click', () => { stop(); openCam(cam); });
  return el;
}

function openCam(cam) {
  $('#player').replaceChildren(ytFrame(embed(cam.id, '')));
  $('#mTitle').textContent = cam.name;
  $('#mSub').textContent = `${cam.st} · stream by ${cam.by}`;
  $('#mLink').href = `https://www.youtube.com/watch?v=${cam.id}`;
  $('#modal').classList.add('on');
}
const closeCam = () => { $('#modal').classList.remove('on'); $('#player').replaceChildren(); };
$('#mClose').onclick = closeCam;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeCam(); };
addEventListener('keydown', e => { if (e.key === 'Escape') closeCam(); });
setInterval(() => document.querySelectorAll('img[data-cam]').forEach(i => { i.src = thumb(i.dataset.cam); }), 3e5);

async function checkLive() {
  if (!YT_API_KEY) return;
  for (let i = 0; i < CAMS.length; i += 50) {
    const chunk = CAMS.slice(i, i + 50);
    const r = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&maxResults=50&id=${chunk.map(c => c.id).join(',')}&key=${YT_API_KEY}`);
    if (!r.ok) return;
    const live = new Set((await r.json()).items.filter(v => v.snippet.liveBroadcastContent === 'live').map(v => v.id));
    chunk.forEach(c => { c.live = live.has(c.id); });
  }
  render();
}

// ---------------------------------------------------------------- rendering
let tab = 'dest', state = 'All', onlyGood = false;
const km = (a, b) => { const dy = (a.lat - b.lat) * 111, dx = (a.lon - b.lon) * 111 * Math.cos(a.lat * Math.PI / 180); return Math.hypot(dx, dy); };
const stageName = s => (STAGES[s] || { label: 'No data' }).label;
const stageColor = s => (STAGES[s] || { c: '#bbb' }).c;

function outlook(d) {                                   // one-line "when" from the today..+10 forecast
  const f = d.forecast;
  if (!f || f[0] < 0) return '';
  if (f[0] === 4) { const end = f.findIndex(s => s === 5); return end > 0 ? `Peak now · until ~${fmt(addDays(today, end), { month: 'short', day: 'numeric' })}` : 'Peak now'; }
  if (f[0] === 5) return 'Past peak';
  const p = f.findIndex(s => s === 4);
  if (p > 0) return `Peak ~${fmt(addDays(today, p), { month: 'short', day: 'numeric' })}`;
  const h = f.findIndex(s => s === 3);
  if (h > 0) return `Near peak ~${fmt(addDays(today, h), { month: 'short', day: 'numeric' })}`;
  return f[0] === 3 ? 'Near peak now' : `Peak ${DAYS_AHEAD}+ days out`;
}
const strip = d => d.forecast ? `<div class="strip" title="Today → +${DAYS_AHEAD} days">${d.forecast.map((s, i) =>
  `<i style="background:${stageColor(s)}" title="${fmt(addDays(today, i))}: ${stageName(s)}"></i>`).join('')}</div>` : '';

function destPopup(d) {
  const el = document.createElement('div');
  el.className = 'pop';
  const me = d.st === 'ME' && maineAt(d.lat, d.lon);
  el.innerHTML = `<h3>${d.name}, ${d.st}</h3>
    <div class="stage"><i class="dot" style="background:${stageColor(d.stage)}"></i>${stageName(d.stage)} <span style="font-weight:400;color:var(--muted)">· ${fmt(addDays(today, offset))}</span></div>
    <div class="lbl">Next ${DAYS_AHEAD} days · ${outlook(d)}</div>${strip(d)}
    ${me ? `<div class="me">Maine Forest Service (official, weekly): <b>${me.FoliageClass}</b> · zone ${me.ZoneName}</div>` : ''}`;
  const near = CAMS.filter(c => km(d, c) < 40).sort((a, b) => km(d, a) - km(d, b)).slice(0, 4);
  if (near.length) {
    el.insertAdjacentHTML('beforeend', '<div class="lbl">Live cams nearby</div>');
    const g = Object.assign(document.createElement('div'), { className: 'cams' });
    near.forEach(c => g.append(camCard(c)));
    el.append(g);
  }
  return el;
}

function render() {
  // map markers
  destLayer.clearLayers(); camLayer.clearLayers();
  DESTS.forEach(d => {
    d.marker = L.circleMarker([d.lat, d.lon], { radius: 8, color: '#fff', weight: 2.5, fillColor: stageColor(d.stage), fillOpacity: 1 })
      .bindTooltip(`<b>${d.name}</b><br>${stageName(d.stage)}`, { direction: 'top', offset: [0, -6] })
      .bindPopup(() => destPopup(d), { minWidth: 290, maxWidth: 320 }).addTo(destLayer);
  });
  CAMS.forEach(c => {
    c.marker = L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', iconSize: [24, 24], html: `<div class="camicon" style="border-color:${stageColor(c.stage)}">📷</div>` }) })
      .bindPopup(() => { const el = document.createElement('div'); el.className = 'pop'; el.style.width = '250px'; el.append(camCard(c)); return el; }, { minWidth: 250 })
      .addTo(camLayer);
  });

  // sidebar
  $('#filters').innerHTML = ['All', 'NH', 'ME', 'VT', 'MA', 'CT', 'RI'].map(s => `<button data-st="${s}" class="${s === state ? 'on' : ''}">${s}</button>`).join('')
    + (tab === 'dest' ? `<label><input type="checkbox" id="good" ${onlyGood ? 'checked' : ''}> near peak or peak</label>` : '');
  const list = $('#list');
  list.replaceChildren();
  const inState = x => state === 'All' || x.st === state;
  const byStage = (a, b) => RANK.indexOf(a.stage) - RANK.indexOf(b.stage) || (a.stage < 0) - (b.stage < 0) || a.name.localeCompare(b.name);
  if (tab === 'dest') {
    const rows = DESTS.filter(inState).filter(d => !onlyGood || d.stage === 3 || d.stage === 4).sort(byStage);
    list.insertAdjacentHTML('beforeend', `<div class="note">Sorted best-to-visit for <b>${fmt(addDays(today, offset))}</b>. Bars show today → +${DAYS_AHEAD} days.</div>`);
    if (!rows.length) list.insertAdjacentHTML('beforeend', '<div class="note">Nothing matches — try another state or date.</div>');
    rows.forEach(d => {
      const el = document.createElement('div');
      el.className = 'dest';
      el.innerHTML = `<div><b>${d.name}</b><span class="st">${d.st}</span></div><div class="when">${outlook(d)}</div>
        <div><i class="dot" style="background:${stageColor(d.stage)}"></i>${stageName(d.stage)}</div><div>${strip(d)}</div>`;
      el.onclick = () => { map.flyTo([d.lat, d.lon], Math.max(map.getZoom(), 9), { duration: 0.6 }); d.marker.openPopup(); };
      list.append(el);
    });
  } else {
    list.insertAdjacentHTML('beforeend', '<div class="note">Thumbnails are the latest frame (refreshed every 5 min). Hover to preview live, click to watch.</div>');
    const g = Object.assign(document.createElement('div'), { className: 'cams' });
    CAMS.filter(inState).sort((a, b) => (b.live - a.live) || byStage(a, b)).forEach(c => g.append(camCard(c)));
    list.append(g);
  }
}

async function showDay() {
  const d = addDays(today, offset);
  $('#dateLabel').innerHTML = `${fmt(d)} <span>· ${offset === 0 ? 'today' : offset > 0 ? 'forecast' : 'past estimate'}</span>`;
  foliage.setUrl(efUrl(d));                               // light image first, sharp one once it has loaded
  clearTimeout(showDay.t);
  showDay.t = setTimeout(() => { const hi = new Image(); hi.onload = () => { if (addDays(today, offset).getTime() === d.getTime()) foliage.setUrl(hi.src); }; hi.src = efUrl(d, true); }, 400);
  const day = await loadDay(offset);
  if (addDays(today, offset).getTime() !== d.getTime()) return;
  [...DESTS, ...CAMS].forEach(p => { p.stage = stageAt(day, p.lat, p.lon); });
  render();
}

// ---------------------------------------------------------------- wiring
$('#legend').innerHTML = STAGES.map(s => `<span><i style="background:${s.c}"></i>${s.short}</span>`).join('');
Object.assign($('#day'), { min: -DAYS_BACK, max: DAYS_AHEAD, value: 0 });
$('#day').oninput = e => { offset = +e.target.value; showDay(); };
document.querySelector('.tabs').onclick = e => {
  if (!e.target.dataset.tab) return;
  tab = e.target.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === e.target));
  render();
};
$('#filters').addEventListener('click', e => { if (e.target.dataset.st) { state = e.target.dataset.st; render(); } });
$('#filters').addEventListener('change', e => { if (e.target.id === 'good') { onlyGood = e.target.checked; render(); } });

showDay();
checkLive();
// forecast strips: sample today..+10 in the background (≈30 KB per day)
Promise.all(Array.from({ length: DAYS_AHEAD + 1 }, (_, i) => loadDay(i))).then(days => {
  DESTS.forEach(d => { d.forecast = days.map(day => stageAt(day, d.lat, d.lon)); });
  render();
});
</script>
</body>
